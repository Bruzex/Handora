name: handora

description: "Handora - artisan seller dashboard for ONDC."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  # Typography & Fonts
  google_fonts: ^6.2.1

  # State Management
  provider: ^6.1.2

  # Local Database
  sqflite: ^2.4.2
  path: ^1.9.1
  cupertino_icons: ^1.0.8

  # Camera + Supabase + AI
  image_picker: ^1.1.2
  supabase_flutter: ^2.8.0
  http: ^1.2.2
  flutter_dotenv: ^5.2.1
  path_provider: ^2.1.5
  uuid: ^4.5.1

  # Voice Assistant (record -> Gemini -> TTS)
  record: ^5.2.0
  flutter_tts: ^4.2.0

  # Loading & Animations
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0

  # High-contrast OTP Input
  pinput: ^4.0.0

  # Network Monitoring
  connectivity_plus: ^6.1.0

  # WhatsApp & URL Launching
  url_launcher: ^6.3.0

  # Charts & Visualizations
  fl_chart: ^0.70.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  sqflite_common_ffi: ^2.3.4+4
  flutter_lints: ^6.0.0

dependency_overrides:
  record_platform_interface: 1.2.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env
