name: handora

description: "Handora — artisan seller dashboard for ONDC."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  # Existing dependencies
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  provider: ^6.1.2
  sqflite: ^2.4.2
  path: ^1.9.1
  cupertino_icons: ^1.0.8

  # New: Camera + Supabase + AI
  image_picker: ^1.1.2
  supabase_flutter: ^2.8.0
  http: ^1.2.2
  flutter_dotenv: ^5.2.1
  path_provider: ^2.1.5
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Existing development dependencies
  sqflite_common_ffi: ^2.3.4+4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env